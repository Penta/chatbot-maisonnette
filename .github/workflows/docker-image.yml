
name: Build Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Même version que le Dockerfile. Si les tests échouent, le job
      # s'arrête ici : rien n'est construit ni poussé sur Docker Hub.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Vérificateur de code (règles dans ruff.toml). Version fixée : une
      # nouvelle version de Ruff ne doit pas bloquer la CI d'elle-même.
      - name: Run Ruff
        run: |
          pip install ruff==0.17.4
          ruff check --output-format=github

      - name: Run tests
        run: python -m unittest

      - name: Log in to DockerHub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login \
            -u "$DOCKER_USERNAME" --password-stdin

      - name: Build Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          IMAGE="$DOCKER_USERNAME/chatbot-maisonnette"

          docker build . \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:latest"

      - name: Push Docker images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          IMAGE="$DOCKER_USERNAME/chatbot-maisonnette"

          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
